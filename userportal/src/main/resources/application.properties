# JWT Configuration
jwt.secret=ttlPlatform123456789012345678901234567890
jwt.expiration=86400000

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ttl_dashboard
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
logging.level.com.ttl.userportal=DEBUG
logging.level.org.springframework.security=DEBUG


# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

#Mail service properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=vindhyakulal13@gmail.com
spring.mail.password=tlsqwbdeakiobuhf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Default Role Configuration
app.user.default.role.id=1
app.user.default.role.name=Employee

# Company Configuration (used in email templates)
app.company.name=Trident Tech Lab
app.login.url=http://localhost:3000

# Email Template Codes (must match template_code in email_templates table)
app.email.template.new-user-welcome=NEW_USER_WELCOME
app.email.template.leave-request=LEAVE_REQUEST
app.email.template.leave-approved=LEAVE_APPROVED
app.email.template.leave-rejected=LEAVE_REJECTED
app.email.template.password-reset=PASSWORD_RESET

# Account Activation Token Configuration
# Number of days until activation link expires (configurable: 1-7 days recommended)
app.activation.token.expiry-days=2
# Base URL for activation link (frontend activation page)
app.activation.base-url=http://localhost:3000/activate
